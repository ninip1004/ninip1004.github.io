<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>EPUB Viewer</title>
    <script src="epub.min.js"></script>
    <style>
        #viewer {
            width: 800px;
            height: 600px;
            margin: 0 auto;
            border: 1px solid #ccc;
        }
    </style>
</head>
<body>
    <h1>My eBook Reader</h1>
    <div id="viewer"></div>
    <a id="epubLink" href="t.epub">Click to Read the Book</a>
    <script>
        // EPUB 파일을 로드하고 렌더링하는 함수
        function loadEpub(url) {
            console.log(`Loading EPUB from: ${url}`);
            const book = ePub(url);
            
            // 책이 완전히 로드될 때까지 기다림
            book.ready.then(() => {
                console.log('EPUB 파일 로드 성공!');
                const rendition = book.renderTo("viewer", {
                    width: "100%",
                    height: "100%",
                    spread: "auto"
                });
                
                // 렌더링 과정 추적
                rendition.on('started', (location) => {
                    console.log('렌더링 시작');
                });
                rendition.on('rendered', (location) => {
                    console.log('렌더링 완료');
                });
                
                // 화면에 책을 표시
                rendition.display();

            }).catch((err) => {
                // 로드 과정에서 발생하는 오류를 잡아냄
                console.error('EPUB 파일 로드 실패:', err);
                alert('책을 불러오는 데 실패했습니다. 파일을 확인해 주세요.');
            });
        }

        // 링크 클릭 이벤트 처리
        window.onload = function() {
            const epubLink = document.getElementById('epubLink');
            if (epubLink) {
                epubLink.addEventListener('click', function(event) {
                    event.preventDefault();
                    console.log('링크 클릭 이벤트 발생');
                    const fileUrl = this.href;
                    loadEpub(fileUrl);
                });
            } else {
                console.error('epubLink 요소를 찾을 수 없습니다.');
            }
        };
    </script>
</body>
</html>
