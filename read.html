<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Enhanced EPUB Reader</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/epubjs/dist/epub.min.js"></script>
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        .container {
             min-height: 100vh; padding: 20px;
            max-width: 1200px;
            margin: 0 auto;
            background: white;
            border-radius: 15px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.1);
            overflow: hidden;
        }

        .header {
            background: linear-gradient(45deg, #4a90e2, #357abd);
            color: white;
            padding: 20px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .header h1 {
            font-size: 1.8rem;
            font-weight: 600;
        }

        .controls {
            background: #f8f9fa;
            padding: 20px 30px;
            border-bottom: 1px solid #e9ecef;
            display: flex;
            gap: 15px;
            align-items: center;
            flex-wrap: wrap;
        }

        .file-input-wrapper {
            position: relative;
            overflow: hidden;
            display: inline-block;
        }

        .file-input-wrapper input[type=file] {
            position: absolute;
            left: -9999px;
        }

        .file-input-label {
            background: #28a745;
            color: white;
            padding: 10px 20px;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-weight: 500;
        }

        .file-input-label:hover {
            background: #218838;
            transform: translateY(-2px);
        }

        .navigation {
            display: flex;
            gap: 10px;
            align-items: center;
        }

        .nav-btn {
            background: #6c757d;
            color: white;
            border: none;
            padding: 10px 15px;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-weight: 500;
        }

        .nav-btn:hover {
            background: #5a6268;
            transform: translateY(-2px);
        }

        .nav-btn:disabled {
            background: #dee2e6;
            cursor: not-allowed;
            transform: none;
        }

        .progress-info {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-left: auto;
        }

        .progress-bar {
            width: 200px;
            height: 6px;
            background: #e9ecef;
            border-radius: 3px;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(45deg, #4a90e2, #357abd);
            width: 0%;
            transition: width 0.3s ease;
        }

        .page-info {
            font-size: 0.9rem;
            color: #6c757d;
            font-weight: 500;
        }

        #viewer {
            width: 100%;
            height: 600px;
            background: #fefefe;
            position: relative;
            overflow: hidden;
        }

        .loading {
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100%;
            flex-direction: column;
            gap: 15px;
        }

        .spinner {
            width: 40px;
            height: 40px;
            border: 4px solid #e9ecef;
            border-top: 4px solid #4a90e2;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .error-message {
            background: #f8d7da;
            color: #721c24;
            padding: 15px 20px;
            border-radius: 8px;
            border: 1px solid #f5c6cb;
            margin: 20px 30px;
            display: none;
            white-space: pre-line;
            font-family: monospace;
            font-size: 0.9em;
        }

        .demo-link {
            background: #007bff;
            color: white;
            text-decoration: none;
            padding: 10px 20px;
            border-radius: 8px;
            transition: all 0.3s ease;
            font-weight: 500;
            margin-right: 10px;
        }

        .demo-link:hover {
            background: #0056b3;
            transform: translateY(-2px);
        }

        .demo-link:last-child {
            margin-right: 0;
        }

        .book-info {
            display: none;
            background: #e3f2fd;
            padding: 15px 30px;
            border-bottom: 1px solid #e1f5fe;
        }

        .book-info h3 {
            color: #1565c0;
            margin-bottom: 5px;
        }

        .book-info p {
            color: #424242;
            margin: 2px 0;
        }

        @media (max-width: 768px) {
            .controls {
                flex-direction: column;
                align-items: stretch;
            }

            .navigation {
                justify-content: center;
            }

            .progress-info {
                margin-left: 0;
                justify-content: center;
            }

            #viewer {
                height: 500px;
            }
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="header">
            <h1>📚  EPUB Reader</h1>
        </div>
        
        <div class="controls">
            
            <a href="#" class="demo-link" id="epubLink" data-epub="t.epub">📖 Read t.epub Book</a>
            
            <div class="navigation">
                <button class="nav-btn" id="prevBtn" disabled>← Previous</button>
                <button class="nav-btn" id="nextBtn" disabled>Next →</button>
            </div>
            
            <div class="progress-info">
                <div class="progress-bar">
                    <div class="progress-fill" id="progressFill"></div>
                </div>
                <span class="page-info" id="pageInfo">Ready</span>
            </div>
        </div>

        <div class="book-info" id="bookInfo">
            <h3 id="bookTitle"></h3>
            <p><strong>Author:</strong> <span id="bookAuthor"></span></p>
            <p><strong>Publisher:</strong> <span id="bookPublisher"></span></p>
        </div>

        <div class="error-message" id="errorMessage"></div>

        <div id="viewer">
            <div class="loading" id="loadingIndicator">
                <div class="spinner"></div>
                <p>Select an EPUB file to start reading...</p>
            </div>
        </div>
    </div>

    <script>
        class EPUBReader {
            constructor() {
                this.book = null;
                this.rendition = null;
                this.currentLocation = null;
                this.isLoading = false;
                
                this.initializeElements();
                this.bindEvents();
            }

            initializeElements() {
                this.elements = {
                    viewer: document.getElementById('viewer'),
                    fileInput: document.getElementById('epubFile'),
                    demoLink: document.getElementById('demoLink'),
                    prevBtn: document.getElementById('prevBtn'),
                    nextBtn: document.getElementById('nextBtn'),
                    progressFill: document.getElementById('progressFill'),
                    pageInfo: document.getElementById('pageInfo'),
                    errorMessage: document.getElementById('errorMessage'),
                    loadingIndicator: document.getElementById('loadingIndicator'),
                    bookInfo: document.getElementById('bookInfo'),
                    bookTitle: document.getElementById('bookTitle'),
                    bookAuthor: document.getElementById('bookAuthor'),
                    bookPublisher: document.getElementById('bookPublisher')
                };
            }

            bindEvents() {
                this.elements.fileInput.addEventListener('change', (e) => {
                    const file = e.target.files[0];
                    if (file) this.loadEpubFromFile(file);
                });

                this.elements.demoLink.addEventListener('click', (e) => {
                    e.preventDefault();
                    this.loadDemoBook();
                });

                // EPUB 파일 직접 로드 링크
                const epubLink = document.getElementById('epubLink');
                if (epubLink) {
                    epubLink.addEventListener('click', (e) => {
                        e.preventDefault();
                        const epubPath = e.target.getAttribute('data-epub');
                        this.loadEpubFromUrl(epubPath);
                    });
                }

                this.elements.prevBtn.addEventListener('click', () => this.previousPage());
                this.elements.nextBtn.addEventListener('click', () => this.nextPage());

                // Keyboard navigation
                document.addEventListener('keydown', (e) => {
                    if (this.rendition) {
                        if (e.key === 'ArrowLeft' || e.key === 'PageUp') {
                            e.preventDefault();
                            this.previousPage();
                        } else if (e.key === 'ArrowRight' || e.key === 'PageDown') {
                            e.preventDefault();
                            this.nextPage();
                        }
                    }
                });
            }

            showError(message) {
                this.elements.errorMessage.textContent = message;
                this.elements.errorMessage.style.display = 'block';
                setTimeout(() => {
                    this.elements.errorMessage.style.display = 'none';
                }, 5000);
            }

            showLoading(message = 'Loading...') {
                this.elements.loadingIndicator.querySelector('p').textContent = message;
                this.elements.loadingIndicator.style.display = 'flex';
            }

            hideLoading() {
                this.elements.loadingIndicator.style.display = 'none';
            }

            async loadEpubFromFile(file) {
                if (this.isLoading) return;
                
                this.isLoading = true;
                this.showLoading(`Loading "${file.name}"...`);
                
                try {
                    console.log('파일 로드 시작:', file.name);
                    
                    // Check if file is actually an EPUB
                    if (!file.name.toLowerCase().endsWith('.epub')) {
                        throw new Error('Please select a valid EPUB file (.epub extension required)');
                    }
                    
                    const arrayBuffer = await file.arrayBuffer();
                    console.log('파일 읽기 완료, 크기:', arrayBuffer.byteLength, 'bytes');
                    
                    // Clean up any existing rendition
                    if (this.rendition) {
                        this.rendition.destroy();
                        this.rendition = null;
                    }
                    
                    // Create new book instance
                    this.book = ePub(arrayBuffer);
                    
                    // Wait for book to be ready
                    await this.book.ready;
                    console.log('EPUB 파일 파싱 완료');
                    
                    // Load book metadata
                    await this.displayBookInfo();
                    
                    // Clear the viewer first
                    this.elements.viewer.innerHTML = '';
                    
                    // Create rendition
                    this.rendition = this.book.renderTo(this.elements.viewer, {
                        width: "100%",
                        height: "100%",
                        spread: "auto",
                        snap: true,
                        allowScriptedContent: true
                    });
                    
                    // Set up event listeners
                    this.rendition.on('relocated', (location) => {
                        console.log('페이지 이동:', location);
                        this.currentLocation = location;
                        this.updateProgress();
                        this.updateNavigation();
                    });
                    
                    this.rendition.on('rendered', (section) => {
                        console.log('렌더링 완료:', section);
                        this.hideLoading();
                    });
                    
                    this.rendition.on('started', (location) => {
                        console.log('렌더링 시작');
                    });
                    
                    // Generate locations for progress tracking
                    this.book.locations.generate(1024).then(() => {
                        console.log('위치 정보 생성 완료');
                    });
                    
                    // Display the first page
                    await this.rendition.display();
                    console.log('첫 페이지 표시 완료');
                    
                    // Enable navigation buttons
                    this.elements.prevBtn.disabled = false;
                    this.elements.nextBtn.disabled = false;
                    
                } catch (error) {
                    console.error('EPUB 로드 중 오류:', error);
                    this.showError(`Failed to load EPUB file: ${error.message}`);
                    this.hideLoading();
                } finally {
                    this.isLoading = false;
                }
            }

            async loadDemoBook() {
                if (this.isLoading) return;
                
                this.isLoading = true;
                this.showLoading('Loading demo book...');
                
                try {
                    // Create demo content and display it directly
                    const demoContent = await this.createDemoEPUB();
                    this.displayDemoContent(demoContent);
                    
                    // Update UI to show we're in demo mode
                    this.elements.prevBtn.disabled = true;  // No navigation in demo
                    this.elements.nextBtn.disabled = true;
                    
                    console.log('Demo book loaded successfully');
                } catch (error) {
                    console.error('Error loading demo book:', error);
                    this.showError('Failed to load demo book.');
                } finally {
                    this.isLoading = false;
                }
            }

            async loadEpubFromUrl(url) {
                if (this.isLoading) return;
                
                this.isLoading = true;
                this.showLoading(`Loading "${url}"...`);
                
                try {
                    console.log('EPUB URL에서 로드 시작:', url);
                    
                    // Fetch the EPUB file from URL
                    const response = await fetch(url);
                    
                    if (!response.ok) {
                        throw new Error(`HTTP error! status: ${response.status} - 파일을 찾을 수 없습니다.`);
                    }
                    
                    const arrayBuffer = await response.arrayBuffer();
                    console.log('EPUB 파일 다운로드 완료, 크기:', arrayBuffer.byteLength, 'bytes');
                    
                    // Clean up any existing rendition
                    if (this.rendition) {
                        this.rendition.destroy();
                        this.rendition = null;
                    }
                    
                    // Create new book instance
                    this.book = ePub(arrayBuffer);
                    
                    // Wait for book to be ready
                    await this.book.ready;
                    console.log('EPUB 파일 파싱 완료');
                    
                    // Load book metadata
                    await this.displayBookInfo();
                    
                    // Clear the viewer first
                    this.elements.viewer.innerHTML = '';
                    
                    // Create rendition
                    this.rendition = this.book.renderTo(this.elements.viewer, {
                        width: "100%",
                        height: "100%",
                        spread: "auto",
                        snap: true,
                        allowScriptedContent: true
                    });
                    
                    // Set up event listeners
                    this.rendition.on('relocated', (location) => {
                        console.log('페이지 이동:', location);
                        this.currentLocation = location;
                        this.updateProgress();
                        this.updateNavigation();
                    });
                    
                    this.rendition.on('rendered', (section) => {
                        console.log('렌더링 완료:', section);
                        this.hideLoading();
                    });
                    
                    this.rendition.on('started', (location) => {
                        console.log('렌더링 시작');
                    });
                    
                    // Generate locations for progress tracking
                    this.book.locations.generate(1024).then(() => {
                        console.log('위치 정보 생성 완료');
                    });
                    
                    // Display the first page
                    await this.rendition.display();
                    console.log('첫 페이지 표시 완료');
                    
                    // Enable navigation buttons
                    this.elements.prevBtn.disabled = false;
                    this.elements.nextBtn.disabled = false;
                    
                } catch (error) {
                    console.error('EPUB URL 로드 중 오류:', error);
                    let errorMessage = `Failed to load EPUB from "${url}": ${error.message}`;
                    
                    if (error.message.includes('404') || error.message.includes('찾을 수 없습니다')) {
                        errorMessage += '\n\n파일이 같은 폴더에 있는지 확인해주세요.';
                    } else if (error.message.includes('CORS') || error.message.includes('cross-origin')) {
                        errorMessage += '\n\nCORS 정책으로 인해 로컬 서버에서 실행해야 할 수 있습니다.';
                    }
                    
                    this.showError(errorMessage);
                    this.hideLoading();
                } finally {
                    this.isLoading = false;
                }
            }

            async createDemoEPUB() {
                // Create a simple demo content that bypasses EPUB.js for testing
                const demoHTML = `
                    <div style="padding: 30px; font-family: Georgia, serif; line-height: 1.6; color: #333;">
                        <h1 style="color: #2c3e50; border-bottom: 2px solid #3498db; padding-bottom: 10px;">Welcome to the Enhanced EPUB Reader!</h1>
                        
                        <p style="font-size: 1.1em; margin: 20px 0;">This is a demonstration of the EPUB reader functionality.</p>
                        
                        <h2 style="color: #34495e; margin-top: 30px;">What you can do:</h2>
                        <ul style="margin: 15px 0; padding-left: 25px;">
                            <li style="margin: 8px 0;">Navigate using the Previous/Next buttons</li>
                            <li style="margin: 8px 0;">Use keyboard arrows or Page Up/Down keys</li>
                            <li style="margin: 8px 0;">See your reading progress</li>
                            <li style="margin: 8px 0;">Load your own EPUB files</li>
                        </ul>
                        
                        <h2 style="color: #34495e; margin-top: 30px;">Features</h2>
                        <p>This reader includes:</p>
                        <ul style="margin: 15px 0; padding-left: 25px;">
                            <li style="margin: 8px 0;">📱 Responsive design that works on mobile and desktop</li>
                            <li style="margin: 8px 0;">📊 Progress tracking</li>
                            <li style="margin: 8px 0;">📖 Book metadata display</li>
                            <li style="margin: 8px 0;">⚠️ Error handling</li>
                            <li style="margin: 8px 0;">⌨️ Keyboard navigation</li>
                        </ul>
                        
                        <div style="background: #ecf0f1; padding: 20px; border-radius: 8px; margin: 25px 0;">
                            <h3 style="color: #2c3e50; margin-top: 0;">📂 To load your own book:</h3>
                            <p style="margin: 10px 0;">Click the <strong>"Choose EPUB File"</strong> button above and select an EPUB file from your computer.</p>
                        </div>
                        
                        <div style="background: #d5e8d4; padding: 20px; border-radius: 8px; margin: 25px 0;">
                            <h3 style="color: #2c3e50; margin-top: 0;">📖 To read t.epub:</h3>
                            <p style="margin: 10px 0;">Click the <strong>"📖 Read t.epub Book"</strong> button to load the t.epub file from the same folder.</p>
                        </div>
                        
                        <p style="margin-top: 30px; font-style: italic; color: #7f8c8d;">This is a demo page. Real EPUB files will display their actual content here.</p>
                    </div>
                `;
                
                return demoHTML;
            }

            async initializeBook(content) {
                try {
                    // Clean up previous book
                    if (this.rendition) {
                        this.rendition.destroy();
                    }

                    // Handle demo content differently
                    if (typeof content === 'string') {
                        // For demo content, create a simple display
                        this.displayDemoContent(content);
                        return;
                    }

                    // Initialize new book
                    this.book = ePub(content);
                    
                    await this.book.ready;
                    
                    // Display book metadata
                    await this.displayBookInfo();
                    
                    // Create rendition
                    this.rendition = this.book.renderTo(this.elements.viewer, {
                        width: "100%",
                        height: "100%",
                        spread: "auto",
                        snap: true
                    });

                    // Set up event listeners
                    this.rendition.on('relocated', (location) => {
                        this.currentLocation = location;
                        this.updateProgress();
                        this.updateNavigation();
                    });

                    this.rendition.on('rendered', () => {
                        this.hideLoading();
                    });

                    // Display first page
                    await this.rendition.display();
                    
                    // Enable navigation
                    this.elements.prevBtn.disabled = false;
                    this.elements.nextBtn.disabled = false;

                } catch (error) {
                    console.error('Error initializing book:', error);
                    this.showError('Failed to initialize the book reader.');
                    this.hideLoading();
                    throw error;
                }
            }

            displayDemoContent(content) {
                // Clear any existing content
                this.elements.viewer.innerHTML = '';
                
                // Create and append the demo content
                const contentDiv = document.createElement('div');
                contentDiv.innerHTML = content;
                contentDiv.style.height = '100%';
                contentDiv.style.overflow = 'auto';
                this.elements.viewer.appendChild(contentDiv);
                
                // Show demo book info
                this.elements.bookTitle.textContent = 'EPUB Reader Demo';
                this.elements.bookAuthor.textContent = 'Demo Author';
                this.elements.bookPublisher.textContent = 'Demo Publisher';
                this.elements.bookInfo.style.display = 'block';
                
                this.elements.pageInfo.textContent = 'Demo Mode';
                this.elements.progressFill.style.width = '100%';
                
                this.hideLoading();
                console.log('Demo content displayed');
            }

            async displayBookInfo() {
                try {
                    const metadata = await this.book.loaded.metadata;
                    console.log('책 메타데이터:', metadata);
                    
                    this.elements.bookTitle.textContent = metadata.title || 'Unknown Title';
                    this.elements.bookAuthor.textContent = metadata.creator || 'Unknown Author';
                    this.elements.bookPublisher.textContent = metadata.publisher || 'Unknown Publisher';
                    this.elements.bookInfo.style.display = 'block';
                } catch (error) {
                    console.warn('책 메타데이터 로드 실패:', error);
                    // Show basic info even if metadata fails
                    this.elements.bookTitle.textContent = 'EPUB Book';
                    this.elements.bookAuthor.textContent = 'Unknown Author';
                    this.elements.bookPublisher.textContent = 'Unknown Publisher';
                    this.elements.bookInfo.style.display = 'block';
                }
            }

            updateProgress() {
                if (!this.currentLocation) return;
                
                const progress = this.book.locations.percentageFromCfi(this.currentLocation.start.cfi);
                const percentage = Math.round(progress * 100);
                
                this.elements.progressFill.style.width = `${percentage}%`;
                this.elements.pageInfo.textContent = `${percentage}%`;
            }

            updateNavigation() {
                if (!this.currentLocation) return;
                
                this.elements.prevBtn.disabled = this.currentLocation.atStart;
                this.elements.nextBtn.disabled = this.currentLocation.atEnd;
            }

            async previousPage() {
                if (this.rendition && !this.elements.prevBtn.disabled) {
                    await this.rendition.prev();
                }
            }

            async nextPage() {
                if (this.rendition && !this.elements.nextBtn.disabled) {
                    await this.rendition.next();
                }
            }
        }

        // Initialize the EPUB reader when the page loads
        document.addEventListener('DOMContentLoaded', () => {
            new EPUBReader();
        });
    </script>
</body>

</html>
